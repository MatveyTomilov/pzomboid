# Отслеживать изменения в уровнях перков игроков в журнале сервера PerkLog.txt
PerkLogs=true

# Максимальное количество предметов, которое можно поместить в контейнер. Ноль означает отсутствие ограничений. (ПРИМЕЧАНИЕ: Это включает в себя отдельные мелкие предметы, такие как гвозди. Ограничение в 50 означает, что можно хранить только 50 гвоздей.) Мин: 0 Макс: 9000 По умолчанию: 0
ItemNumbersLimitPerContainer=0

# Количество дней перед удалением старых кровавых пятен.
# Удаление происходит при загрузке частей карты.
# Ноль означает, что они никогда не исчезнут Мин: 0 Макс: 365 По умолчанию: 0
BloodSplatLifespanDays=0

# Разрешить использование не-ASCII символов (кириллица и т.д.) в именах пользователей
AllowNonAsciiUsername=<REDACTED>

BanKickGlobalSound=true

# Если включено, когда срабатывает HoursForCorpseRemoval, также будут удалены и трупы игроков.
RemovePlayerCorpsesOnCorpseRemoval=false

# Если истина, игрок может использовать кнопку
TrashDeleteAll=true

# Если истина, игрок может нанести удар в ответ, когда его ударил другой игрок.
PVPMeleeWhileHitReaction=false

# Если истина, игроки должны навести курсор на другого игрока, чтобы увидеть его отображаемое имя.
MouseOverToSeeDisplayName=false

# Если истина, автоматически скрывает игроков, которых вы не видите (как зомби).
HidePlayersBehindYou=false

# Множитель урона для ближних атак PVP. Мин: 0,00 Макс: 500,00 По умолчанию: 30,00
PVPMeleeDamageModifier=30.0

# Множитель урона для дальних атак PVP. Мин: 0,00 Макс: 500,00 По умолчанию: 50,00
PVPFirearmDamageModifier=50.0

# Модификатор привлекательности зомби к автомобилям. (Меньшие значения могут помочь с лагом.) Мин: 0,00 Макс: 10,00 По умолчанию: 0,50
CarEngineAttractionModifier=0.5

# Игроки сталкиваются с друг другом.
PlayerBumpPlayer=true

# Контролирует отображение удаленных игроков на карте в игре. 1=Скрыто 2=Друзья 3=Все Мин: 1 Макс: 4 По умолчанию: 1
MapRemotePlayerVisibility=3

# Мин: 1 Макс: 300 По умолчанию: 5
BackupsCount=5

BackupsOnStart=true

BackupsOnVersionChange=true

# Мин: 0 Макс: 1500 По умолчанию: 0
BackupsPeriod=0

# Отключает буксировку транспортных средств
DisableVehicleTowing=false

# Отключает буксировку прицепов
DisableTrailerTowing=false

# Отключает буксировку сгоревших транспортных средств
DisableBurntTowing=false

# Путь к файлу со списком слов, которые необходимо запретить. Каждое слово должно быть на отдельной строке.
BadWordListFile=

# Путь к файлу со списком слов, которые должны быть разрешены, даже если в нём содержатся нецензурные слова. Каждое слово должно быть на отдельной строке.
GoodWordListFile=

# Что делать с отправителем нецензурного слова в чате: 1 - забанить, 2 - исключить, 3 - зарегистрировать нарушение в базе данных, 4 - отключить чат
BadWordPolicy=3

# Символ или фрагмент текста, который заменит нецензурное слово
BadWordReplacement=[HIDDEN]

# Отключает защиту от читов для системы безопасности.
AntiCheatSafety=2

# Отключает защиту от читов для скорости персонажа.
AntiCheatSpeed=2

# Отключает защиту от прохождения сквозь препятствия со стороны игрока.
AntiCheatNoClip=4

# Отключает защиту от читов для ударов персонажа.
AntiCheatHit=2

# Отключает проверку исключений пакетов и защиту от мошенничества.
AntiCheatPacketException=4

# Отключает защиту от читов для прав доступа игроков.
AntiCheatPermission=2

# Отключает защиту от читов для опыта игрока.
AntiCheatXP=2

# Отключает защиту от читов для убежищ.
AntiCheatSafeHouse=2

# Отключает защиту игрока от читерства.
AntiCheatPlayer=2

# Отключает проверку контрольной суммы для защиты от читов.
AntiCheatChecksum=2

# Устанавливает период обновления многопользовательского режима в секундах. Статистика отключается, если значение равно 0. Мин: 0 Макс: 10 По умолчанию: 1
MultiplayerStatisticsPeriod=1

# Отключает табло.
DisableScoreboard=false

# Скрывает админов в списке игроков.
HideAdminsInPlayerList=false

# Устанавливает лимит на обработку сетевых пакетов от каждого клиента на сервере. Мин: 100 Макс: 1000 По умолчанию: 300
MaxPacketsPerSecond=300

# Отображает координаты игрока в правом нижнем углу.
ShowCoordinates=true

# Значение для генератора мира.
# Если вы хотите изменить это значение, введите новое значение и удалите файл map_worldgen.bin в папке сохранения.
Seed=vnzGBlQSrGUIKtpt

UsePhysicsHitReaction=false

# Мин: 64 Макс: 1024 По умолчанию: 200
ChatMessageCharacterLimit=200

# Мин: 1 Макс: 30 По умолчанию: 3
ChatMessageSlowModeTime=3